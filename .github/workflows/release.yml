name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          VERSION=$(git describe --tags --always)
          TAG=${GITHUB_REF#refs/tags/}
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}, Tag: ${TAG}"

  download-apk:
    runs-on: ubuntu-latest
    needs: version
    outputs:
      apk_name: ${{ steps.download.outputs.apk_name }}
    steps:
      - name: Wait for draft release and download APK
        id: download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          APK_NAME="svarla-${TAG}.apk"
          REPO="${{ github.repository }}"

          echo "Waiting for draft release with APK for tag ${TAG}..."

          # Retry loop: wait up to 60s for the draft release to appear
          for i in $(seq 1 12); do
            # Find the draft release matching this tag
            RELEASE=$(gh api "repos/${REPO}/releases" --jq ".[] | select(.tag_name == \"${TAG}\" and .draft == true)" 2>/dev/null || echo "")

            if [ -n "$RELEASE" ]; then
              echo "Found draft release for ${TAG}"

              # Get the APK asset download URL
              ASSET_URL=$(echo "$RELEASE" | jq -r ".assets[] | select(.name == \"${APK_NAME}\") | .url")

              if [ -n "$ASSET_URL" ] && [ "$ASSET_URL" != "null" ]; then
                echo "Downloading APK from ${ASSET_URL}"
                gh api "$ASSET_URL" -H "Accept: application/octet-stream" > "${APK_NAME}"

                if [ -f "$APK_NAME" ] && [ -s "$APK_NAME" ]; then
                  echo "APK downloaded successfully: ${APK_NAME}"
                  echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
              fi
            fi

            echo "Attempt $i/12: Draft release or APK not found yet. Waiting 5s..."
            sleep 5
          done

          echo "ERROR: Could not find draft release with APK for tag ${TAG} after 60s"
          exit 1

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ steps.download.outputs.apk_name }}
          retention-days: 1

  server:
    runs-on: ubuntu-latest
    needs: [version, download-apk]
    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: ./apk

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APK_FILE=apk/${{ needs.download-apk.outputs.apk_name }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/svarla-server:${{ needs.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/svarla-server:latest
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  mediabridge:
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push mediabridge image
        uses: docker/build-push-action@v5
        with:
          context: ./mediabridge
          file: ./mediabridge/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/svarla-mediabridge:${{ needs.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/svarla-mediabridge:latest
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=mediabridge
          cache-to: type=gha,mode=max,scope=mediabridge

  publish-release:
    runs-on: ubuntu-latest
    needs: [version, server, mediabridge]
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          REPO="${{ github.repository }}"

          echo "Publishing draft release for tag ${TAG}..."

          # Find the draft release
          RELEASE_ID=$(gh api "repos/${REPO}/releases" --jq ".[] | select(.tag_name == \"${TAG}\" and .draft == true) | .id")

          if [ -z "$RELEASE_ID" ]; then
            echo "ERROR: Could not find draft release for tag ${TAG}"
            exit 1
          fi

          # Un-draft the release
          gh api "repos/${REPO}/releases/${RELEASE_ID}" \
            -X PATCH \
            -f draft=false

          echo "Release ${TAG} published successfully!"
