name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          VERSION=$(git describe --tags --always)
          TAG=${GITHUB_REF#refs/tags/}
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}, Tag: ${TAG}"

      - name: Verify commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor ${{ github.sha }} origin/main; then
            echo "ERROR: Tagged commit is not on the main branch."
            echo "Releases can only be created from commits that exist on main."
            exit 1
          fi
          echo "Verified: commit ${{ github.sha }} is on main"

      - name: Verify tag signature
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"

          # Use GitHub's own tag verification — checks that the tag is signed
          # by a GPG key registered on the repository owner's account.
          TAG_SHA=$(git rev-list -1 "$TAG")

          # GitHub annotated tags have their own object; lightweight tags point directly to a commit
          TAG_TYPE=$(git cat-file -t "$TAG" 2>/dev/null || echo "commit")
          if [ "$TAG_TYPE" = "tag" ]; then
            TAG_OBJ_SHA=$(git rev-parse "$TAG")
            API_PATH="repos/${{ github.repository }}/git/tags/$TAG_OBJ_SHA"
          else
            # Lightweight tag — check the commit signature
            API_PATH="repos/${{ github.repository }}/git/commits/$TAG_SHA"
          fi

          # GitHub's signature verification is async — it may not be ready
          # immediately after a tag push triggers the workflow. Retry a few times.
          VERIFIED="false"
          for i in 1 2 3 4 5; do
            VERIFIED=$(gh api "$API_PATH" --jq '.verification.verified' 2>/dev/null || echo "false")
            if [ "$VERIFIED" = "true" ]; then
              break
            fi
            echo "Attempt $i: verification not yet confirmed, waiting 10s..."
            sleep 10
          done

          if [ "$VERIFIED" != "true" ]; then
            echo "ERROR: Tag $TAG is not signed by a verified GPG key."
            echo "The tag must be signed by a key registered on the repository owner's GitHub account."
            echo "Debug: API response for $API_PATH:"
            gh api "$API_PATH" --jq '.verification' 2>/dev/null || echo "(API call failed)"
            exit 1
          fi

          echo "Tag $TAG signature verified by GitHub"

  build-apk:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Build unsigned APK
        run: |
          TAG="${{ needs.verify.outputs.tag }}"
          VERSION_NAME="${TAG#v}"
          VERSION_CODE="$(git rev-list --count HEAD)"
          make apk VERSION_NAME="$VERSION_NAME" VERSION_CODE="$VERSION_CODE"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-apk
          path: |
            build-output/app-release-unsigned.apk
          retention-days: 7

  server:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        run: |
          make ci-server \
            IMAGE_TAG="${{ needs.verify.outputs.tag }}" \
            REGISTRY="${{ env.REGISTRY }}/${{ github.repository_owner }}" \
            PLATFORM="linux/amd64,linux/arm64"

  mediabridge:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push mediabridge image
        run: |
          make ci-mediabridge \
            IMAGE_TAG="${{ needs.verify.outputs.tag }}" \
            REGISTRY="${{ env.REGISTRY }}/${{ github.repository_owner }}" \
            PLATFORM="linux/amd64,linux/arm64"

  modem-gateway:
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build modem-gateway (${{ matrix.arch }})
        run: |
          docker buildx build \
            --platform linux/${{ matrix.arch }} \
            --build-arg VERSION=${{ needs.verify.outputs.tag }} \
            --build-arg COMMIT=${{ github.sha }} \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            --output type=local,dest=./out \
            -f modem-gateway/Dockerfile.build \
            modem-gateway/

      - name: Upload modem-gateway binary
        uses: actions/upload-artifact@v4
        with:
          name: modem-gateway-linux-${{ matrix.arch }}
          path: ./out/modem-gateway
          retention-days: 7

  create-draft-release:
    runs-on: ubuntu-latest
    needs: [verify, build-apk, server, mediabridge, modem-gateway]
    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: unsigned-apk
          path: ./build-output

      - name: Download modem-gateway amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: modem-gateway-linux-amd64
          path: ./modem-gateway-amd64

      - name: Download modem-gateway arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: modem-gateway-linux-arm64
          path: ./modem-gateway-arm64

      - name: Prepare modem-gateway binaries
        run: |
          mv ./modem-gateway-amd64/modem-gateway ./build-output/modem-gateway-linux-amd64
          mv ./modem-gateway-arm64/modem-gateway ./build-output/modem-gateway-linux-arm64
          chmod +x ./build-output/modem-gateway-linux-amd64
          chmod +x ./build-output/modem-gateway-linux-arm64

      - name: Compute checksums
        run: |
          cd build-output
          sha256sum app-release-unsigned.apk modem-gateway-linux-amd64 modem-gateway-linux-arm64 > checksums.sha256
          cat checksums.sha256

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.verify.outputs.tag }}"
          REPO="${{ github.repository }}"
          RELEASES_DIR="docs/releases"
          RELEASE_FILE="${RELEASES_DIR}/${TAG}.md"

          # Build release body from release notes file
          if [ -f "$RELEASE_FILE" ]; then
            RELEASE_CONTENT="$(sed '1{/^# /d}' "$RELEASE_FILE")"
          else
            RELEASE_CONTENT="Release ${TAG}"
          fi

          RELEASE_BODY="${RELEASE_CONTENT}

          ## Docker

          Pull the container images:
          \`\`\`
          docker pull ${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/svarla-server:${TAG}
          docker pull ${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/svarla-mediabridge:${TAG}
          \`\`\`

          ## Status

          ⚠️ **This is a draft release.** Artifacts are unsigned.
          The maintainer will sign the APK and container images, then publish this release.

          ## Build Info

          - Commit: ${{ github.sha }}
          - Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Create draft release with unsigned APK and modem-gateway binaries
          gh release create "$TAG" \
            --title "Svarla $TAG" \
            --notes "$RELEASE_BODY" \
            --draft \
            "build-output/app-release-unsigned.apk#svarla-${TAG}-unsigned.apk" \
            "build-output/modem-gateway-linux-amd64#modem-gateway-linux-amd64" \
            "build-output/modem-gateway-linux-arm64#modem-gateway-linux-arm64" \
            "build-output/checksums.sha256#checksums.sha256"

          echo "Draft release created for $TAG"
