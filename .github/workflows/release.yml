name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          VERSION=$(git describe --tags --always)
          TAG=${GITHUB_REF#refs/tags/}
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}, Tag: ${TAG}"

      - name: Verify commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor ${{ github.sha }} origin/main; then
            echo "ERROR: Tagged commit is not on the main branch."
            echo "Releases can only be created from commits that exist on main."
            exit 1
          fi
          echo "Verified: commit ${{ github.sha }} is on main"

      - name: Verify tag signature
        env:
          TRUSTED_GPG_FINGERPRINT: ${{ secrets.TRUSTED_GPG_FINGERPRINT }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          TRUSTED_KEY=".github/keys/maintainer.pub"

          if [ -z "$TRUSTED_GPG_FINGERPRINT" ]; then
            echo "ERROR: TRUSTED_GPG_FINGERPRINT secret is not set."
            echo "Set it in Settings → Secrets to the fingerprint of the maintainer GPG key."
            exit 1
          fi

          # Import key into temporary keyring
          export GNUPGHOME="$(mktemp -d)"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          gpg --batch --import "$TRUSTED_KEY" 2>/dev/null

          # Verify the key file hasn't been swapped — fingerprint must match the secret
          ACTUAL_FINGERPRINT=$(gpg --list-keys --with-colons 2>/dev/null | grep '^fpr' | head -1 | cut -d: -f10)
          if [ "$ACTUAL_FINGERPRINT" != "$TRUSTED_GPG_FINGERPRINT" ]; then
            echo "ERROR: Key fingerprint mismatch!"
            echo "  Expected (from secret): $TRUSTED_GPG_FINGERPRINT"
            echo "  Actual (from file):     $ACTUAL_FINGERPRINT"
            echo ""
            echo "  The key file .github/keys/maintainer.pub may have been tampered with."
            exit 1
          fi

          echo "Key fingerprint verified against secret"

          # Verify the tag signature
          if ! git verify-tag "$TAG" 2>/dev/null; then
            echo "ERROR: Tag $TAG is NOT signed by the trusted key."
            exit 1
          fi

          echo "Tag signature verified: $TAG"

  download-apk:
    runs-on: ubuntu-latest
    needs: verify
    outputs:
      apk_name: ${{ steps.download.outputs.apk_name }}
    steps:
      - name: Wait for draft release and download APK
        id: download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.verify.outputs.tag }}"
          APK_NAME="svarla-${TAG}.apk"
          REPO="${{ github.repository }}"

          echo "Waiting for draft release with APK for tag ${TAG}..."

          # Retry loop: wait up to 60s for the draft release to appear
          for i in $(seq 1 12); do
            RELEASE=$(gh api "repos/${REPO}/releases" \
              --jq ".[] | select(.tag_name == \"${TAG}\" and .draft == true)" 2>/dev/null || echo "")

            if [ -n "$RELEASE" ]; then
              echo "Found draft release for ${TAG}"

              ASSET_URL=$(echo "$RELEASE" | jq -r ".assets[] | select(.name == \"${APK_NAME}\") | .url")

              if [ -n "$ASSET_URL" ] && [ "$ASSET_URL" != "null" ]; then
                echo "Downloading APK from ${ASSET_URL}"
                gh api "$ASSET_URL" -H "Accept: application/octet-stream" > "${APK_NAME}"

                if [ -f "$APK_NAME" ] && [ -s "$APK_NAME" ]; then
                  echo "APK downloaded successfully: ${APK_NAME}"
                  echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
              fi
            fi

            echo "Attempt $i/12: Draft release or APK not found yet. Waiting 5s..."
            sleep 5
          done

          echo "ERROR: Could not find draft release with APK for tag ${TAG} after 60s"
          exit 1

      - name: Verify APK checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.verify.outputs.tag }}"
          REPO="${{ github.repository }}"
          APK_NAME="${{ steps.download.outputs.apk_name }}"

          # Download checksum file from the draft release
          RELEASE=$(gh api "repos/${REPO}/releases" \
            --jq ".[] | select(.tag_name == \"${TAG}\" and .draft == true)")
          CHECKSUM_URL=$(echo "$RELEASE" | jq -r '.assets[] | select(.name == "checksums.sha256") | .url')

          if [ -n "$CHECKSUM_URL" ] && [ "$CHECKSUM_URL" != "null" ]; then
            gh api "$CHECKSUM_URL" -H "Accept: application/octet-stream" > checksums.sha256
            echo "Verifying APK checksum..."
            EXPECTED=$(awk '{print $1}' checksums.sha256)
            ACTUAL=$(sha256sum "$APK_NAME" | awk '{print $1}')
            if [ "$EXPECTED" != "$ACTUAL" ]; then
              echo "ERROR: Checksum mismatch!"
              echo "  Expected: $EXPECTED"
              echo "  Actual:   $ACTUAL"
              exit 1
            fi
            echo "Checksum verified: $ACTUAL"
          else
            echo "WARNING: No checksum file found in draft release, skipping verification"
          fi

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ steps.download.outputs.apk_name }}
          retention-days: 1

  server:
    runs-on: ubuntu-latest
    needs: [verify, download-apk]
    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: ./apk

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        run: |
          make ci-server \
            APK_PATH="./apk/${{ needs.download-apk.outputs.apk_name }}" \
            IMAGE_TAG="${{ needs.verify.outputs.tag }}" \
            REGISTRY="${{ env.REGISTRY }}/${{ github.repository_owner }}" \
            PLATFORM="linux/amd64,linux/arm64"

  mediabridge:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push mediabridge image
        run: |
          make ci-mediabridge \
            IMAGE_TAG="${{ needs.verify.outputs.tag }}" \
            REGISTRY="${{ env.REGISTRY }}/${{ github.repository_owner }}" \
            PLATFORM="linux/amd64,linux/arm64"

  publish-release:
    runs-on: ubuntu-latest
    needs: [verify, server, mediabridge]
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.verify.outputs.tag }}"
          REPO="${{ github.repository }}"

          echo "Publishing draft release for tag ${TAG}..."

          RELEASE_ID=$(gh api "repos/${REPO}/releases" \
            --jq ".[] | select(.tag_name == \"${TAG}\" and .draft == true) | .id")

          if [ -z "$RELEASE_ID" ]; then
            echo "ERROR: Could not find draft release for tag ${TAG}"
            exit 1
          fi

          gh api "repos/${REPO}/releases/${RELEASE_ID}" \
            -X PATCH \
            -f draft=false

          echo "Release ${TAG} published successfully!"
