# Svarla — Development
#
# Builds from source and runs the server in watch mode: source files are
# bind-mounted from the host and `tsx watch` restarts the server on any change.
# All defaults are set for local development — no .env file needed.
#
# Usage:
#   docker compose up        (foreground, so you can see reload logs)
#   docker compose up -d     (background)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: svarla
      POSTGRES_USER: svarla
      POSTGRES_PASSWORD: devpass
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U svarla"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      tags:
        - "svarla-server:dev"
    # Run both watchers: the web bundle builder (esbuild --watch, rebuilds
    # dist/web/ on change) and the server (tsx watch, restarts on change).
    # The web watcher runs in the background; if it exits, the container stops.
    command: sh -c "npm run dev:web & npm run dev"
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://svarla:devpass@db:5432/svarla
      LOG_LEVEL: debug
      INITIAL_PASSWORD: dev
      # Base URL used to build provider webhook URLs and the modem-gateway
      # signaling WebSocket URL (http → ws, https → wss). The server is
      # published on localhost:3000 below, so point at that in development.
      BASE_URL: "http://localhost:3000"
      CORS_ORIGIN: ""
      MEDIA_BRIDGE_URL: http://mediabridge:9090
      APK_SOURCE: local
      EXPERIMENTAL_PROVIDERS: true
      # Poll for file changes instead of relying on inotify, which is not
      # reliably delivered across Docker bind mounts.
      #   WATCH_POLL          → web/build.ts polling watcher (ms)
      #   CHOKIDAR_USEPOLLING → tsx watch (backend) polling
      WATCH_POLL: "300"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      # Bind-mount source so edits on the host trigger tsx watch reloads.
      - ./src:/app/src
      - ./web:/app/web
      - ./migrations:/app/migrations
      - ./public:/app/public
      - ./scripts:/app/scripts
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./tsconfig.migrations.json:/app/tsconfig.migrations.json:ro
      - ./tsconfig.scripts.json:/app/tsconfig.scripts.json:ro
      - ./package.json:/app/package.json:ro
      # Keep the container's node_modules (built for the container platform);
      # this anonymous volume shadows any host node_modules on the mounts above.
      - /app/node_modules
      - ./server-config.yaml:/app/server-config.yaml:ro
      - ./build-output/svarla-signed.apk:/app/public/downloads/svarla.apk:ro

  mediabridge:
    build:
      context: ./mediabridge
      tags:
        - "svarla-mediabridge:dev"
    ports:
      - "10443:10443"     # WebRTC (ICE/DTLS/SRTP over TCP)
      - "10443:10443/udp" # WebRTC (ICE/DTLS/SRTP over UDP)
      - "5060:5060/udp" # SIP (UDP)
      - "5060:5060/tcp" # SIP (TCP)
      - "5061:5061/tcp" # SIP TLS (SIPS)
      - "5062:5062/udp" # RTP media (SIP audio)
      - "9091:9091"     # Audio WebSocket
    environment:
      LOG_LEVEL: debug
      # PUBLIC_IP is the IP address advertised to WebRTC clients in ICE candidates.
      # It MUST be an address the client devices (e.g. the Android app) can reach.
      # 127.0.0.1 only works when the client runs on the same host as MediaBridge.
      PUBLIC_IP: "${PUBLIC_IP:-127.0.0.1}"
    volumes:
      - ./mediabridge/mediabridge-config.yaml:/mediabridge-config.yaml:ro
    depends_on:
      server:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
