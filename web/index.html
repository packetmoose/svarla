<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#5b2d90" />
  <title>Svarla</title>
  <!--
    Apply the stored theme before first paint to avoid a flash of the wrong
    theme. Full theme wiring (listeners, meta sync) happens in theme.ts.
  -->
  <script>
    (function () {
      try {
        var pref = localStorage.getItem("theme-preference");
        if (pref === "light" || pref === "dark") {
          document.documentElement.setAttribute("data-theme", pref);
        }
      } catch (e) {}
    })();
  </script>
  <link rel="icon" href="favicon.ico" sizes="32x32" />
  <link rel="icon" type="image/png" href="icon-192.png" sizes="192x192" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <div id="app"></div>
  <script type="module" src="bundle.js"></script>
</body>
</html>
